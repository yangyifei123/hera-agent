<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Hera terminal demo placeholder">
  <rect width="960" height="420" rx="18" fill="#0b1020"/>
  <circle cx="34" cy="32" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="32" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="32" r="7" fill="#27c93f"/>
  <text x="32" y="82" fill="#7dd3fc" font-family="Consolas, monospace" font-size="22">$ hera create agent my-reviewer --template coder --mode all</text>
  <text x="32" y="122" fill="#d1fae5" font-family="Consolas, monospace" font-size="22">Agent "my-reviewer" created.</text>
  <text x="32" y="162" fill="#d1fae5" font-family="Consolas, monospace" font-size="22">Use it with: opencode --agent my-reviewer "your task"</text>
  <text x="32" y="226" fill="#7dd3fc" font-family="Consolas, monospace" font-size="22">$ opencode --agent my-reviewer "review src/auth.ts"</text>
  <text x="32" y="266" fill="#fef3c7" font-family="Consolas, monospace" font-size="22">my-reviewer: checking security, correctness, and tests...</text>
  <text x="32" y="330" fill="#a7f3d0" font-family="Consolas, monospace" font-size="22">Persistent agent + memory + teams, inside OpenCode.</text>
</svg>
